
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | IIIT Bhubaneswar</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <nav class="auth-nav">
        <a href="index.html" class="brand">
            <div class="brand-logo">IIIT</div>
            <div class="brand-text">
                <strong>IIIT BHUBANESWAR</strong>
                <span>MESS MANAGEMENT SYSTEM</span>
            </div>
        </a>
        <a href="index.html" class="back-link">← Back to Home</a>
    </nav>

    <main class="register-container">

        <div class="register-card">

            <div class="register-heading">
                <span class="section-label">JOIN THE MESS PORTAL</span>
                <h1>Create your student account</h1>
                <p>Enter your details to register with the mess management system.</p>
            </div>

            <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

            <form id="registerForm">

                <div class="form-grid">

                    <div class="form-group full-width">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" placeholder="Enter your full name"
                            minlength="2" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" placeholder="Enter your email"
                            autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="student_id">Student ID *</label>
                        <input type="text" id="student_id" placeholder="Enter student ID"
                            maxlength="50" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department">
                            <option value="">Select department</option>
                            <option value="CSE">Computer Science and Engineering</option>
                            <option value="ECE">Electronics and Communication Engineering</option>
                            <option value="CE">Civil Engineering</option>
                            <option value="EEE">Electrical and Electronics Engineering</option>
                            <option value="IT">Information Technology</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="hostel">Hostel</label>
                        <input type="text" id="hostel" placeholder="Enter hostel name">
                    </div>

                    <div class="form-group">
                        <label for="room_number">Room Number</label>
                        <input type="text" id="room_number" placeholder="Enter room number">
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <div class="password-wrapper">
                            <input type="password" id="password"
                                placeholder="Minimum 8 characters"
                                autocomplete="new-password"
                                minlength="8" required>
                            <button type="button" class="toggle-password"
                                data-target="password">Show</button>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="confirmPassword">Confirm Password *</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword"
                                placeholder="Re-enter your password"
                                autocomplete="new-password" required>
                            <button type="button" class="toggle-password"
                                data-target="confirmPassword">Show</button>
                        </div>
                    </div>

                </div>

                <button type="submit" class="auth-submit" id="registerButton">
                    Create Student Account →
                </button>

            </form>

            <div class="auth-switch">
                Already registered?
                <a href="login.html">Sign in</a>
            </div>

            <p class="registration-note">
                Student registration only. Administrator accounts are created separately.
            </p>

        </div>

    </main>

    <script src="js/auth.js"></script>
</body>
</html>
